<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Paint 10 — Free MS Paint Online Alternative</title>
    <meta name="description" content="Use Paint 10, a free MS Paint alternative online. Draw, edit photos, add text and use layers in your browser. No sign-up; images stay on your device.">
    <meta name="application-name" content="Paint 10">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://eiis1000.github.io/paint-10/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Paint 10">
    <meta property="og:title" content="Paint 10 — Free MS Paint Online Alternative">
    <meta property="og:description" content="Draw, edit photos, add text and use layers with a free MS Paint alternative in your browser. No sign-up; images stay on your device.">
    <meta property="og:url" content="https://eiis1000.github.io/paint-10/">
    <meta property="og:image" content="https://eiis1000.github.io/paint-10/paint-10.png">
    <meta property="og:image:alt" content="Paint 10 palette and brush icon">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Paint 10 — Free MS Paint Online Alternative">
    <meta name="twitter:description" content="Draw, edit photos, add text and use layers with a free MS Paint alternative in your browser. No sign-up; images stay on your device.">
    <meta name="twitter:image" content="https://eiis1000.github.io/paint-10/paint-10.png">
    <meta name="twitter:image:alt" content="Paint 10 palette and brush icon">
    <link rel="icon" href="./paint-10.ico" sizes="any">
    <link rel="icon" href="./paint-10.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./paint-10.png">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Paint 10",
        "url": "https://eiis1000.github.io/paint-10/",
        "description": "A free, independent MS Paint alternative for drawing and editing pictures online, with brushes, shapes, editable text and optional layers. Images are processed locally in your browser.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript, WebAssembly and WebGL in a current desktop browser.",
        "isAccessibleForFree": true,
        "license": "https://github.com/eiis1000/paint-10/blob/main/LICENSE",
        "image": "https://eiis1000.github.io/paint-10/paint-10.png"
      }
    </script>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f0f0f0;
      }

      #paint {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        font: 16px system-ui, sans-serif;
        color: #25364a;
        text-align: center;
        padding: 24px;
      }

      #loading strong {
        font-size: 30px;
      }

      #loading[hidden] {
        display: none;
      }
    </style>
  </head>

  <body>
    <canvas id="paint" aria-label="Paint 10 drawing application"></canvas>
    <div id="loading">
      <strong>Paint 10</strong>
      <span id="status">Loading…</span>
    </div>

    <script type="module">
      import init, { WebHandle } from './pkg/paint_10.js';

      const loading = document.querySelector('#loading');
      const status = document.querySelector('#status');

      try {
        await init();
        const app = new WebHandle();
        await app.start(document.querySelector('#paint'));
        window.paint10 = app;
        loading.hidden = true;

        window.setInterval(() => {
          if (app.has_panicked()) {
            loading.hidden = false;
            status.textContent = app.panic_message()
              || 'Paint 10 stopped unexpectedly. Reload to restart.';
          }
        }, 1000);
      } catch (error) {
        status.textContent = `Paint 10 could not start: ${error}. WebGL is required.`;
        console.error(error);
      }
    </script>
  </body>
</html>
