[package]
name = "paint-10"
version = "0.1.0"
edition = "2021"
description = "A native Rust recreation of the Windows 10 Paint experience"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "tiff", "webp"] }
tiff = "=0.9.1"
ab_glyph = "0.2.32"
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
unicode-segmentation = "=1.13.3"
epaint_default_fonts = "=0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
fontdb = { version = "0.23", default-features = false, features = ["std"] }
color_quant = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
tempfile = "3"
fontdb = { version = "0.23", features = ["fs", "memmap", "fontconfig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Window", "Storage", "Document", "HtmlCanvasElement"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.4"
gtk = { version = "=0.18.2", features = ["v3_24"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
# The script checks the target OS, so Windows cross builds embed the same icon.
embed-resource = "=3.0.11"

[profile.dev]
opt-level = 1
# Keep file/line backtraces without hundreds of megabytes of type information.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
