name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build native archives and validate the Nix package
        type: boolean
        default: true

permissions:
  contents: read

# A newer commit supersedes an unfinished build of the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ inputs.full || startsWith(github.ref, 'refs/tags/v') || steps.changes.outputs.native == 'true' }}
      browser: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || steps.changes.outputs.browser == 'true' }}
      nix: ${{ inputs.full || startsWith(github.ref, 'refs/tags/v') || steps.changes.outputs.nix == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            native:
              - 'src/**'
              - 'assets/**'
              - 'vendor/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'scripts/package-native.py'
              - 'scripts/tests/test_package_native.py'
              - '.github/workflows/build.yml'
            browser:
              - 'src/**'
              - 'assets/**'
              - 'vendor/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'web/index.html'
              - 'web/sitemap.xml'
              - 'web/browser-events.test.mjs'
              - 'scripts/build-web.sh'
              - 'scripts/install-wasm-bindgen.sh'
              - '.github/workflows/build.yml'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'vendor/**'
              - '.cargo/**'
              - '.github/workflows/build.yml'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-repository-privacy.py --all-history
      - run: python -m unittest discover -s scripts/tests -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build:
    needs: checks
    if: needs.checks.outputs.native == 'true' || needs.checks.outputs.browser == 'true'
    strategy:
      fail-fast: true
      matrix:
        # Web-only edits need one Linux runner, not three native builds.
        os: ${{ fromJSON(needs.checks.outputs.native == 'true' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Full runs share release dependencies between tests and packaging.
      # Ordinary runs do not compile a second native profile just for archives.
      PAINT_PROFILE: ${{ (inputs.full || startsWith(github.ref, 'refs/tags/v')) && 'release' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Add browser target
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ env.PAINT_PROFILE }}
          # PRs reuse the default branch cache without writing a duplicate.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install Linux development libraries
        if: runner.os == 'Linux' && needs.checks.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Test native targets
        if: needs.checks.outputs.native == 'true'
        run: cargo test --locked --all-targets --profile ${{ env.PAINT_PROFILE }}
      - name: Test native clipboard shortcut patch
        if: needs.checks.outputs.native == 'true'
        run: cargo test --locked -p egui-winit --lib --profile ${{ env.PAINT_PROFILE }} paint10_clipboard_tests
      - name: Lint native targets
        if: needs.checks.outputs.native == 'true'
        run: cargo clippy --locked --all-targets --profile ${{ env.PAINT_PROFILE }} -- -D warnings
      - name: Build native release
        if: env.PAINT_PROFILE == 'release'
        run: cargo build --locked --release --bin paint-10
      - uses: actions/setup-python@v5
        if: env.PAINT_PROFILE == 'release'
        with:
          python-version: '3.12'
      - name: Package and verify native release
        if: env.PAINT_PROFILE == 'release'
        run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        if: env.PAINT_PROFILE == 'release'
        with:
          name: paint-10-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}
          path: |
            target/paint-10-*.tar.gz
            target/paint-10-*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # Keep Linux and WASM in one job so compatible host build dependencies
      # share a target directory and a cache instead of a second Linux cache.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        with:
          node-version: 24
      - name: Test browser events
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        run: node --test web/browser-events.test.mjs
      - name: Install browser build tools
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          bash scripts/install-wasm-bindgen.sh
      - name: Lint browser target
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        run: cargo clippy --locked --release --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Build browser release
        if: runner.os == 'Linux' && needs.checks.outputs.browser == 'true'
        run: bash scripts/build-web.sh
      - name: Upload browser preview
        if: >-
          runner.os == 'Linux' && needs.checks.outputs.browser == 'true' &&
          (github.event_name == 'pull_request' ||
           github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-artifact@v4
        with:
          name: paint-10-browser
          path: target/web
          retention-days: 1
          if-no-files-found: error
      - name: Upload GitHub Pages site
        if: >-
          runner.os == 'Linux' && needs.checks.outputs.browser == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/web
          retention-days: 1

  nix-package:
    needs: checks
    if: needs.checks.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Cache Nix compiler artifacts
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.toml', 'Cargo.lock', 'vendor/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          gc-max-store-size-linux: 3G
      - run: nix flake check -L
      - name: Build reusable Rust dependencies
        run: nix build -L .#paint-10.cargoArtifacts --out-link result-deps
      - name: Build and test Nix package
        run: nix build -L .#paint-10

  deploy-pages:
    if: >-
      always() && !cancelled() && needs.checks.result == 'success' &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.nix-package.result) &&
      needs.checks.outputs.browser == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [checks, build, nix-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
