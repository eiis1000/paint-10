name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: paint-10-linux
            package: target/paint-10-linux.tar.gz
          - os: windows-latest
            artifact: paint-10-windows
            package: target/paint-10-windows.zip
          - os: macos-latest
            artifact: paint-10-macos
            package: target/paint-10-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native package structure and icon assets
        run: python -m unittest discover -s scripts/tests -v
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Test native clipboard shortcut patch
        run: cargo test --locked -p egui-winit --lib paint10_clipboard_tests
      - run: cargo build --locked --release
      - name: Package and verify native release
        # Checks every Windows PE icon image, macOS plist/ICNS, and startup of
        # the extracted executable. Archives retain Unix executable permissions.
        run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  nix-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build .#paint-10

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node web/browser-events.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y lld
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: bash scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paint-10-browser
          path: target/web
          if-no-files-found: error
      - name: Upload GitHub Pages site
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/web

  deploy-pages:
    # Pull requests, tags, and non-default branches still build, but cannot deploy.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [native, nix-package, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
