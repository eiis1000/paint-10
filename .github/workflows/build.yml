name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: paint-10-linux
            binary: target/release/paint-10
          - os: windows-latest
            artifact: paint-10-windows
            binary: target/release/paint-10.exe
          - os: macos-latest
            artifact: paint-10-macos
            binary: target/release/paint-10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Test native clipboard shortcut patch
        run: cargo test --locked -p egui-winit --lib paint10_clipboard_tests
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  nix-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build .#paint-10

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node web/browser-events.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y lld
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - run: bash scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paint-10-browser
          path: target/web
          if-no-files-found: error
