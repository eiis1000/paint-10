<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Paint 10</title>
  <desc>A white artist's palette with five bright paint colors and a blue paintbrush.</desc>

  <defs>
    <linearGradient id="ceramic" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5edf5"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#164eb2"/>
      <stop offset="0.55" stop-color="#328bf2"/>
      <stop offset="1" stop-color="#1554bd"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b4c7d8"/>
      <stop offset="0.45" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#91a9c0"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffbf57"/>
      <stop offset="1" stop-color="#f47835"/>
    </linearGradient>

    <!-- The second contour is the transparent thumb hole. -->
    <path id="palette" fill-rule="evenodd" d="
      M 120,28
      C 64,28 20,66 20,117
      C 20,170 63,212 117,218
      C 146,221 167,207 164,188
      C 162,173 142,166 148,151
      C 155,134 187,142 207,124
      C 235,99 199,28 120,28 Z
      M 117,158
      C 114,148 103,143 93,148
      C 82,153 78,163 82,172
      C 86,182 98,184 108,178
      C 117,173 120,165 117,158 Z"/>
  </defs>

  <!-- A dark lower edge gives the silhouette weight at small sizes. -->
  <use href="#palette" transform="translate(0 5)" fill="#1c3550"/>
  <use href="#palette" fill="url(#ceramic)" stroke="#29465f" stroke-width="7"
       stroke-linejoin="round"/>

  <circle cx="55" cy="109" r="18" fill="#19a4dc"/>
  <circle cx="80" cy="67" r="18" fill="#35ba85"/>
  <circle cx="130" cy="55" r="18" fill="#ffc444"/>
  <circle cx="173" cy="80" r="18" fill="#ef615b"/>
  <circle cx="55" cy="155" r="16" fill="#8663d8"/>

  <!-- One broad diagonal brush; no detail depends on a hairline stroke. -->
  <g transform="rotate(30 174 125)" stroke="#233d59" stroke-width="6"
     stroke-linejoin="round">
    <path d="M 163,20 C 163,5 185,5 185,20 L 187,143 L 161,143 Z"
          fill="url(#handle)"/>
    <path d="M 170,22 L 170,125" fill="none" stroke="#8cc8ff" stroke-width="4"
          stroke-linecap="round"/>
    <path d="M 160,141 L 188,141 L 191,175 L 157,175 Z" fill="url(#metal)"/>
    <path d="M 162,175 L 186,175" fill="none" stroke="#738ca4" stroke-width="4"/>
    <path d="M 157,176 L 191,176 C 191,204 180,218 156,226
             C 164,209 151,199 157,176 Z" fill="url(#bristles)"/>
    <path d="M 156,211 C 169,213 180,208 187,199
             C 182,213 171,221 156,226 Z" fill="#e8523e" stroke="none"/>
    <path d="M 169,182 C 165,192 170,199 168,205" fill="none"
          stroke="#ffe2a1" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
